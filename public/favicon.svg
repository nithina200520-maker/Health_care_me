<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D4FF" />
      <stop offset="100%" stop-color="#3478F6" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D4FF" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#3478F6" stop-opacity="0.1" />
    </linearGradient>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="100" height="100" rx="24" fill="#0B1728" />
  <rect x="2" y="2" width="96" height="96" rx="22" stroke="url(#primaryGrad)" stroke-width="2" stroke-opacity="0.4" />
  
  <!-- Subtle Cross/Bridge -->
  <path d="M50 20 V80 M20 50 H80" stroke="url(#primaryGrad)" stroke-width="8" stroke-linecap="round" />
  
  <!-- Modern Intersecting Bridge Nodes -->
  <circle cx="50" cy="50" r="14" fill="#101F33" stroke="#00D4FF" stroke-width="3" />
  <circle cx="50" cy="50" r="6" fill="#00D4FF" />
  <circle cx="20" cy="50" r="4" fill="#3478F6" />
  <circle cx="80" cy="50" r="4" fill="#3478F6" />
  <circle cx="50" cy="20" r="4" fill="#00D4FF" />
  <circle cx="50" cy="80" r="4" fill="#00D4FF" />
</svg>
